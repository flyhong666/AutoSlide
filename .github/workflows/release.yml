name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # 触发条件 1：推送形如 v1.0.0, v2.5.2 的 Tag
  workflow_dispatch: # 触发条件 2：支持在 GitHub 页面手动点击运行
    inputs:
      release_tag:
        description: '发布版本 Tag（手动运行必填，例如 v2.5.3）'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    # 声明权限，防止创建 Release 时抛出 403 错误
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 1. 编译 Debug APK（Gradle 会自动使用默认证书完成签名，确保可以正常安装）
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 2. 确定发布所用的 Tag 名称（兼容 Tag 推送与手动运行）
      - name: Determine Tag Name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            # 手动触发且未填 Tag 时，使用当前时间戳作为默认 Tag
            TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          fi
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "Release tag will be: $TAG_NAME"

      # 3. 寻找编译好的 Debug APK 文件（路径更新为 app/build/outputs/apk/debug/）
      - name: Locate APK File
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "错误：未查找到生成的 APK 文件！"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      # 4. 发布至 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.APK_PATH }}
          name: "AutoSlide ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
