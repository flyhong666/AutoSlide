name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # 触发条件 1：推送形如 v1.0.0 的 Tag
    branches:
      - main # 触发条件 2：直接 push 到 main 分支时自动触发构建发布
  workflow_dispatch: # 触发条件 3：支持在 GitHub 页面手动点击运行
    inputs:
      release_tag:
        description: '自定义 Tag（选填，留空则自动提取 versionName）'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # 声明写权限用于创建 Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ================= 【新增/优化】解码还原并校验 JKS 证书 =================
      - name: Decode Keystore File
        run: |
          # 过滤 Windows 可能夹带的换行符并解码
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > app/keystore.jks
          
          echo "======== 检查临时 JKS 文件 ========"
          ls -lh app/keystore.jks
          
          # 判断文件大小，防止坏包产生
          FILE_SIZE=$(stat -c%s "app/keystore.jks")
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "错误：还原的 keystore.jks 文件异常（仅 $FILE_SIZE 字节），请重新在本地生成 KEYSTORE_BASE64！"
            exit 1
          fi

      # 1. 编译 Release APK（注入签名所需的环境变量）
      - name: Build Release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # ================= 【新增步骤】清理临时 KeyStore 文件 =================
      - name: Clean Up Keystore
        if: always() # 无论编译成功或失败，都强制执行清理
        run: rm -f app/keystore.jks

      # 2. 从 app/build.gradle.kts 中自动提取 versionName 作为 Tag
      - name: Determine Tag Name
        id: tag
        run: |
          # 使用正则表达式从 app/build.gradle.kts 提取 versionName 的值
          VERSION_NAME=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName\s*=\s*["'\''\`]([^"'\''\`]+)["'\''\`].*/\1/')

          if [ -z "$VERSION_NAME" ]; then
            echo "错误：未能在 app/build.gradle.kts 中找到有效的 versionName！"
            exit 1
          fi

          # 确保 Tag 带有 'v' 前缀（例如从 1.0.0 变为 v1.0.0）
          if [[ "$VERSION_NAME" != v* ]]; then
            AUTO_TAG="v$VERSION_NAME"
          else
            AUTO_TAG="$VERSION_NAME"
          fi

          # 优先级：手动输入的 Tag > 推送的 Git Tag > 从 build.gradle.kts 提取的 Tag
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="$AUTO_TAG"
          fi

          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "Release tag will be: $TAG_NAME"

      # 3. 寻找编译好的 APK 文件
      - name: Locate APK File
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "错误：未查找到生成的 APK 文件！"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      # ================= 【新增步骤】自动校验生成的 APK 签名 =================
      - name: Verify APK Signature
        run: |
          echo "======== 开始校验生成的 APK 签名 ========"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose ${{ env.APK_PATH }}

      # 4. 创建并发布到 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.APK_PATH }}
          name: "AutoSlide ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
